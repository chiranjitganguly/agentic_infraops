[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchestrator-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=0.1.0",
    "litellm>=1.40.0",
    "pydantic>=2.0.0",
    "structlog>=24.0.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
    "circuitbreaker>=1.4.0",
    "bcrypt>=4.0.0",
    "a2a-sdk>=0.3.0,<1.0.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.4.0", "mypy>=1.10.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]  # Adjust path based on actual package location