version: "3.9"

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.2-python3.11
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "30"
    PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    LITELLM_GATEWAY_URL: http://litellm:4000
    GCP_PROJECT_ID: ${GCP_PROJECT_ID}
    GOOGLE_APPLICATION_CREDENTIALS: /opt/gcp/gcp-sa.json
    PYTHONPATH: /opt/airflow/dags:/opt/infraops
    _PIP_ADDITIONAL_REQUIREMENTS: "structlog pydantic circuitbreaker prometheus_client"
  volumes:
    - ../workflows/dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
    - ../secrets:/opt/gcp:ro
    - ../mcp_servers:/opt/infraops/mcp_servers:ro
    - ../contracts:/opt/infraops/contracts:ro
    - ../skills:/opt/infraops/skills:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ─── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && echo -e \"GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q healthz <&3'"]
      interval: 10s
      timeout: 5s
      retries: 5

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=${GCP_PROJECT_ID}
    ports:
      - "8085:8085"
    environment:
      CLOUDSDK_CORE_PROJECT: ${GCP_PROJECT_ID}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  litellm:
    build:
      context: ./services/litellm
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./services/litellm/litellm_config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus

  # ─── System Init (runs migrations + PubSub setup + default user) ─────────────
  infraops-init:
    build:
      context: ..
      dockerfile: docker/services/infraops_init/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      DEFAULT_USER_ID: ${DEFAULT_USER_ID:-cg4ai@gmail.com}
      DEFAULT_USER_ROLE: ${DEFAULT_USER_ROLE:-developer}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:-password}
      PLATFORM_USER_ID: ${PLATFORM_USER_ID:-platformengg@infraops.com}
      PLATFORM_USER_ROLE: ${PLATFORM_USER_ROLE:-platform_engineer}
      PLATFORM_PASSWORD: ${PLATFORM_PASSWORD:-password}
    depends_on:
      postgres:
        condition: service_healthy
      pubsub-emulator:
        condition: service_healthy
    restart: "no"

  # ─── Airflow ─────────────────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    environment:
      <<: *airflow-env
      AIRFLOW__WEBSERVER__WORKERS: "2"
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: "300"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-worker:
    <<: *airflow-common
    command: celery worker --concurrency 2
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
      DUMB_INIT_SETSID: "0"

  airflow-init:
    <<: *airflow-common
    command: >-
      bash -c "airflow db upgrade &&
      airflow users create --username admin --firstname Admin --lastname User --role Admin --email ${AIRFLOW_ADMIN_EMAIL} --password ${AIRFLOW_ADMIN_PASSWORD} || true"
    restart: "no"

  # ─── MCP Servers ─────────────────────────────────────────────────────────────
  mcp-postgres:
    build:
      context: ..
      dockerfile: docker/services/mcp_postgres/Dockerfile
    ports:
      - "8092:8092"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MCP_PORT: "8092"
    depends_on:
      infraops-init:
        condition: service_completed_successfully

  mcp-pubsub:
    build:
      context: ..
      dockerfile: docker/services/mcp_pubsub/Dockerfile
    ports:
      - "8091:8091"
    environment:
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      MCP_PORT: "8091"
    depends_on:
      infraops-init:
        condition: service_completed_successfully

  mcp-gcp-resource:
    build:
      context: ..
      dockerfile: docker/services/mcp_gcp_resource/Dockerfile
    ports:
      - "8090:8090"
    environment:
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa.json
      MCP_PORT: "8090"
    volumes:
      - ${GCP_SA_KEY_PATH}:/secrets/gcp-sa.json:ro

  mcp-knowledge-base:
    build:
      context: ..
      dockerfile: docker/services/mcp_knowledge_base/Dockerfile
    ports:
      - "8093:8093"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: infraops_knowledge_base
      LITELLM_GATEWAY_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      MCP_PORT: "8093"
    depends_on:
      qdrant:
        condition: service_healthy

  mcp-backstage:
    build:
      context: ..
      dockerfile: docker/services/mcp_backstage/Dockerfile
    ports:
      - "8096:8096"
    environment:
      BACKSTAGE_API_URL: ${BACKSTAGE_API_URL}
      BACKSTAGE_API_TOKEN: ${BACKSTAGE_API_TOKEN}
      MCP_PORT: "8096"

  mcp-gmail:
    build:
      context: ..
      dockerfile: docker/services/mcp_gmail/Dockerfile
    ports:
      - "8095:8095"
    environment:
      GMAIL_CREDENTIALS_PATH: /secrets/gmail-creds.json
      GMAIL_TOKEN_PATH: /secrets/gmail-token.json
      INFRAOPS_EMAIL: ${INFRAOPS_EMAIL}
      MCP_PORT: "8095"
    volumes:
      - ${GMAIL_CREDENTIALS_PATH}:/secrets/gmail-creds.json:ro
      - gmail-token:/secrets

  mcp-airflow:
    build:
      context: ..
      dockerfile: docker/services/mcp_airflow/Dockerfile
    ports:
      - "8094:8094"
    environment:
      AIRFLOW_API_URL: http://airflow-webserver:8080/api/v1
      AIRFLOW_USERNAME: ${AIRFLOW_ADMIN_EMAIL}
      AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      MCP_PORT: "8094"
    depends_on:
      airflow-webserver:
        condition: service_healthy

  # ─── Agents ──────────────────────────────────────────────────────────────────
  orchestrator-agent:
    build:
      context: ..
      dockerfile: docker/services/orchestrator/Dockerfile
    ports:
      - "8001:8001"
    environment:
      PORT: "8001"
      LITELLM_GATEWAY_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      INTENT_CLASSIFICATION_MODEL: ${INTENT_CLASSIFICATION_MODEL}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PROVISIONING_AGENT_URL: http://provisioning-agent:8002
      ENQUIRY_AGENT_URL: http://enquiry-agent:8003
      FAQ_AGENT_URL: http://faq-agent:8004
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
    depends_on:
      infraops-init:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy

  provisioning-agent:
    build:
      context: ..
      dockerfile: docker/services/provisioning/Dockerfile
    ports:
      - "8002:8002"
    environment:
      PORT: "8002"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
    depends_on:
      infraops-init:
        condition: service_completed_successfully
      mcp-pubsub:
        condition: service_started

  enquiry-agent:
    build:
      context: ..
      dockerfile: docker/services/enquiry/Dockerfile
    ports:
      - "8003:8003"
    environment:
      PORT: "8003"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa.json
    volumes:
      - ../secrets/gcp-sa.json:/secrets/gcp-sa.json:ro
    depends_on:
      infraops-init:
        condition: service_completed_successfully

  faq-agent:
    build:
      context: ..
      dockerfile: docker/services/faq/Dockerfile
    ports:
      - "8004:8004"
    environment:
      PORT: "8004"
      LITELLM_GATEWAY_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      FAQ_GENERATION_MODEL: ${FAQ_GENERATION_MODEL}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      infraops-init:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy

  web-backend:
    build:
      context: ..
      dockerfile: docker/services/web_backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ORCHESTRATOR_AGENT_URL: http://orchestrator-agent:8001
      PROVISIONING_AGENT_URL: http://provisioning-agent:8002
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3001}
      JWT_SECRET: ${JWT_SECRET:-infraops-jwt-secret-change-in-prod}
    depends_on:
      infraops-init:
        condition: service_completed_successfully
      orchestrator-agent:
        condition: service_started

  web-frontend:
    build:
      context: ../web/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        VITE_API_KEY: ${VITE_API_KEY}
    ports:
      - "3001:80"
    depends_on:
      - web-backend

  gmail-poller:
    build:
      context: ..
      dockerfile: docker/services/gmail_poller/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ORCHESTRATOR_AGENT_URL: http://orchestrator-agent:8001
      PROVISIONING_AGENT_URL: http://provisioning-agent:8002
      GMAIL_POLL_INTERVAL_SECONDS: "30"
    depends_on:
      infraops-init:
        condition: service_completed_successfully
      mcp-gmail:
        condition: service_started

  notification-service:
    build:
      context: ..
      dockerfile: docker/services/notification_service/Dockerfile
    environment:
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      PUBSUB_STATUS_SUBSCRIPTION: infraops-provisioning-status-sub
    depends_on:
      infraops-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  qdrant-data:
  airflow-logs:
  prometheus-data:
  grafana-data:
  gmail-token:

networks:
  default:
    name: infraops-network
