---
# Orchestrator Agent
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: orchestrator-agent
  description: "Classifies natural language infrastructure requests, enforces guardrails and rate limits, and routes to provisioning, enquiry, or FAQ sub-agents."
  annotations:
    backstage.io/techdocs-ref: dir:.
    prometheus.io/scrape: "true"
    prometheus.io/port: "9001"
  tags:
    - agent
    - google-adk
    - python
  links:
    - url: http://localhost:8001
      title: Local endpoint
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: agentic-infraops
  providesApis:
    - orchestrator-api
  dependsOn:
    - component:provisioning-agent
    - component:enquiry-agent
    - component:faq-agent
    - component:mcp-postgres
---
# Provisioning Agent
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: provisioning-agent
  description: "Validates and queues GCP resource provisioning requests. Publishes PubSub events for Airflow DAG execution."
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9002"
  tags:
    - agent
    - google-adk
    - python
  links:
    - url: http://localhost:8002
      title: Local endpoint
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: agentic-infraops
  providesApis:
    - provisioning-api
  dependsOn:
    - component:mcp-postgres
    - component:mcp-pubsub
    - skill:gcp-compute
    - skill:gcp-network
---
