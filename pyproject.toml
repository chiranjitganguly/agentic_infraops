[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-infraops"
version = "0.1.0"
description = "Agentic InfraOps Self-Service Platform"
requires-python = ">=3.11"

# ─── Ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["agents", "contracts", "business_logic", "mcp_servers", "workflows", "web", "evaluations", "infrastructure", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "ANN",  # flake8-annotations
    "ASYNC",# flake8-async
]
ignore = [
    "ANN101",  # missing type annotation for self
    "ANN102",  # missing type annotation for cls
    "S101",    # use of assert (allowed in tests)
    "S608",    # possible SQL injection (handled by parameterised queries)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN"]
"infrastructure/scripts/**/*.py" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "contracts", "business_logic", "mcp_servers", "workflows", "web", "evaluations"]
force-sort-within-sections = true

# ─── Black ────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | \.eggs
  | \.egg-info
  | dist
  | build
)/
'''

# ─── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ─── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "-v",
]
markers = [
    "unit: Unit tests (no external services)",
    "integration: Integration tests (require Docker Compose stack)",
    "contract: Contract validation tests",
    "workflow: Airflow DAG tests",
    "slow: Tests taking more than 10 seconds",
]
